<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc">
  <title id="title">The select readiness loop</title><desc id="desc">A server rebuilds descriptor sets, blocks in select, receives readiness results, accepts new clients, reads ready sockets, writes buffered output when writable, removes closed sockets, and repeats.</desc>
  <defs><marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0L12 6L0 12z" fill="#62E5DB"/></marker></defs><rect width="1500" height="820" fill="#0B1220"/><g font-family="Arial, sans-serif">
    <text x="70" y="70" fill="#F1F5F9" font-size="40" font-weight="700">A readiness loop asks: “Which operation would not block now?”</text><text x="70" y="108" fill="#A8B7CB" font-size="21">Ready is permission to attempt I/O, not proof that an entire application message is available.</text>
    <g text-anchor="middle"><rect x="540" y="160" width="420" height="90" rx="18" fill="#172B45" stroke="#4AA8FF" stroke-width="3"/><text x="750" y="198" fill="#83C6FF" font-size="23" font-weight="700">1. Build read/write FD sets</text><text x="750" y="228" fill="#D8E3EF" font-size="19">include listening FD and client FDs</text>
    <rect x="540" y="310" width="420" height="90" rx="18" fill="#143743" stroke="#35D3C9" stroke-width="3"/><text x="750" y="348" fill="#62E5DB" font-size="23" font-weight="700">2. select(...) blocks</text><text x="750" y="378" fill="#D8E3EF" font-size="19">until ready, timeout, signal, or error</text>
    <rect x="120" y="480" width="360" height="125" rx="18" fill="#111C2E" stroke="#35D3C9" stroke-width="3"/><text x="300" y="520" fill="#62E5DB" font-size="22" font-weight="700">Listening FD readable</text><text x="300" y="556" fill="#D8E3EF" font-size="19">accept one or more clients</text><text x="300" y="586" fill="#A8B7CB" font-size="17">new connected FDs join the set</text>
    <rect x="570" y="480" width="360" height="125" rx="18" fill="#111C2E" stroke="#F9B357" stroke-width="3"/><text x="750" y="520" fill="#F9B357" font-size="22" font-weight="700">Client FD readable</text><text x="750" y="556" fill="#D8E3EF" font-size="19">read available stream bytes</text><text x="750" y="586" fill="#A8B7CB" font-size="17">0 means orderly EOF</text>
    <rect x="1020" y="480" width="360" height="125" rx="18" fill="#111C2E" stroke="#A78BFA" stroke-width="3"/><text x="1200" y="520" fill="#C4B5FD" font-size="22" font-weight="700">Client FD writable</text><text x="1200" y="556" fill="#D8E3EF" font-size="19">send some queued bytes</text><text x="1200" y="586" fill="#A8B7CB" font-size="17">keep unsent remainder buffered</text></g>
    <g stroke="#62E5DB" stroke-width="4" fill="none" marker-end="url(#a)"><line x1="750" y1="252" x2="750" y2="306"/><path d="M670 402 C600 450 430 442 350 478"/><line x1="750" y1="402" x2="750" y2="477"/><path d="M830 402 C900 450 1070 442 1150 478"/><path d="M300 610 C300 710 560 715 635 648"/><path d="M750 610 L750 685 C750 730 1000 715 1120 610"/></g>
    <rect x="515" y="675" width="470" height="78" rx="16" fill="#153929"/><text x="750" y="707" text-anchor="middle" fill="#B5F5D4" font-size="21" font-weight="700">Update per-connection state, then loop</text><text x="750" y="735" text-anchor="middle" fill="#D8E3EF" font-size="18">do only bounded work before waiting again</text>
  </g>
</svg>
