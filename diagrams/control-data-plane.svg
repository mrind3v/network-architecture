<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" role="img" aria-labelledby="title desc">
  <title id="title">Control information and user data on separate paths</title>
  <desc id="desc">Examples from SS7, SIP, and FTP show a control path that coordinates a separate bearer, media, or file-data path.</desc>
  <defs><marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L12 6L0 12z" fill="#62E5DB"/></marker><marker id="b" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L12 6L0 12z" fill="#F9B357"/></marker></defs>
  <rect width="1500" height="720" fill="#0B1220"/>
  <g font-family="Arial, sans-serif">
    <text x="70" y="72" fill="#F1F5F9" font-size="40" font-weight="700">Control says what should happen; the data path carries the thing itself</text>
    <text x="70" y="110" fill="#A8B7CB" font-size="21">Separating the paths keeps coordination traffic independent from bulk or real-time data.</text>
    <g font-size="20">
      <text x="80" y="190" fill="#F1F5F9" font-size="27" font-weight="700">Telephone call (SS7)</text>
      <rect x="80" y="218" width="210" height="72" rx="12" fill="#172B45"/><text x="185" y="263" text-anchor="middle" fill="#E6EEF8">Switch A</text>
      <rect x="1210" y="218" width="210" height="72" rx="12" fill="#172B45"/><text x="1315" y="263" text-anchor="middle" fill="#E6EEF8">Switch B</text>
      <line x1="292" y1="240" x2="1208" y2="240" stroke="#62E5DB" stroke-width="4" marker-end="url(#a)"/><text x="750" y="225" text-anchor="middle" fill="#62E5DB">SS7 call setup and release messages</text>
      <line x1="292" y1="278" x2="1208" y2="278" stroke="#F9B357" stroke-width="7" marker-start="url(#b)" marker-end="url(#b)"/><text x="750" y="318" text-anchor="middle" fill="#F9B357">separate voice bearer circuit</text>

      <text x="80" y="390" fill="#F1F5F9" font-size="27" font-weight="700">Internet call (SIP)</text>
      <rect x="80" y="418" width="210" height="72" rx="12" fill="#172B45"/><text x="185" y="463" text-anchor="middle" fill="#E6EEF8">Alice</text>
      <rect x="645" y="418" width="210" height="72" rx="12" fill="#292543"/><text x="750" y="463" text-anchor="middle" fill="#E6EEF8">SIP proxy</text>
      <rect x="1210" y="418" width="210" height="72" rx="12" fill="#172B45"/><text x="1315" y="463" text-anchor="middle" fill="#E6EEF8">Bob</text>
      <line x1="292" y1="438" x2="643" y2="438" stroke="#62E5DB" stroke-width="4" marker-end="url(#a)"/><line x1="857" y1="438" x2="1208" y2="438" stroke="#62E5DB" stroke-width="4" marker-end="url(#a)"/><text x="750" y="413" text-anchor="middle" fill="#62E5DB">SIP signalling through the proxy</text>
      <path d="M292 478 C570 565 930 565 1208 478" fill="none" stroke="#F9B357" stroke-width="7" marker-start="url(#b)" marker-end="url(#b)"/><text x="750" y="575" text-anchor="middle" fill="#F9B357">RTP/SRTP media usually follows a direct path</text>
    </g>
    <rect x="270" y="620" width="960" height="62" rx="14" fill="#153929" stroke="#35D3C9" stroke-width="2"/><text x="750" y="659" text-anchor="middle" fill="#B5F5D4" font-family="Arial, sans-serif" font-size="23" font-weight="700">FTP repeats the pattern: one control connection, separate data connections.</text>
  </g>
</svg>
