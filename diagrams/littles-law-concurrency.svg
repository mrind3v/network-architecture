<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc"><title id="title">Little's Law relates throughput, latency, and concurrency</title><desc id="desc">At steady state, average in-flight work L equals average arrival or completion rate lambda times average time W. At 10000 requests per second, 100 milliseconds gives about 1000 in-flight requests, while one second gives about 10000.</desc><rect width="1500" height="820" fill="#0B1220"/><g font-family="Arial, sans-serif"><text x="70" y="70" fill="#F1F5F9" font-size="40" font-weight="700">Little's Law turns latency into a capacity number</text><text x="70" y="108" fill="#A8B7CB" font-size="21">For a stable system over a suitable boundary: average in-flight work = average rate × average time in the system.</text>
<rect x="250" y="155" width="1000" height="100" rx="18" fill="#143743" stroke="#35D3C9" stroke-width="3"/><text x="750" y="218" text-anchor="middle" fill="#B5F5D4" font-size="36" font-weight="700">L = λW</text><g text-anchor="middle"><text x="340" y="300" fill="#62E5DB" font-size="20" font-weight="700">L: average items in the boundary</text><text x="750" y="300" fill="#62E5DB" font-size="20" font-weight="700">λ: items per second</text><text x="1160" y="300" fill="#62E5DB" font-size="20" font-weight="700">W: average seconds per item</text></g>
<text x="130" y="385" fill="#F1F5F9" font-size="24" font-weight="700">Example: 10,000 requests/second</text><line x1="205" y1="675" x2="1320" y2="675" stroke="#64748B" stroke-width="3"/><line x1="205" y1="675" x2="205" y2="420" stroke="#64748B" stroke-width="3"/><g fill="#F9B357"><rect x="300" y="650" width="130" height="25"/><rect x="520" y="625" width="130" height="50"/><rect x="740" y="575" width="130" height="100"/><rect x="960" y="475" width="130" height="200"/><rect x="1180" y="425" width="130" height="250"/></g><g text-anchor="middle" font-size="18"><text x="365" y="705" fill="#D8E3EF">10 ms</text><text x="585" y="705" fill="#D8E3EF">20 ms</text><text x="805" y="705" fill="#D8E3EF">100 ms</text><text x="1025" y="705" fill="#D8E3EF">500 ms</text><text x="1245" y="705" fill="#D8E3EF">1 s</text><text x="365" y="638" fill="#F9B357" font-weight="700">100</text><text x="585" y="613" fill="#F9B357" font-weight="700">200</text><text x="805" y="563" fill="#F9B357" font-weight="700">1,000</text><text x="1025" y="463" fill="#F9B357" font-weight="700">5,000</text><text x="1245" y="413" fill="#F9B357" font-weight="700">10,000</text></g><text x="95" y="530" transform="rotate(-90 95 530)" fill="#A8B7CB" font-size="18">average requests in flight</text><rect x="260" y="750" width="980" height="45" rx="10" fill="#153929"/><text x="750" y="779" text-anchor="middle" fill="#B5F5D4" font-size="20" font-weight="700">Use consistent units: 100 ms = 0.1 s, so 10,000 × 0.1 = 1,000.</text></g></svg>
