<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">A process file descriptor table points to kernel resources</title>
  <desc id="desc">File descriptors zero through five are process-local table indexes. Entries point to standard streams, a listening socket, a connected TCP socket, and a log file managed by the kernel.</desc>
  <defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#62E5DB"/></marker></defs>
  <rect width="1500" height="760" fill="#0B1220"/>
  <g font-family="Arial, sans-serif">
    <text x="78" y="78" fill="#F1F5F9" font-size="40" font-weight="700">An FD is a process-local lookup number</text>
    <text x="78" y="118" fill="#A8B7CB" font-size="22">The number selects a table entry; the actual resource and TCP state live in the kernel.</text>

    <rect x="78" y="160" width="510" height="530" rx="20" fill="#172B45" stroke="#4AA8FF" stroke-width="3"/>
    <text x="112" y="207" fill="#83C6FF" font-size="25" font-weight="700">Server process — FD table</text>
    <g font-size="22">
      <rect x="118" y="244" width="430" height="58" rx="10" fill="#111C2E"/><text x="145" y="280" fill="#F1F5F9">0</text><text x="220" y="280" fill="#D8E3EF">standard input</text>
      <rect x="118" y="316" width="430" height="58" rx="10" fill="#111C2E"/><text x="145" y="352" fill="#F1F5F9">1</text><text x="220" y="352" fill="#D8E3EF">standard output</text>
      <rect x="118" y="388" width="430" height="58" rx="10" fill="#111C2E"/><text x="145" y="424" fill="#F1F5F9">2</text><text x="220" y="424" fill="#D8E3EF">standard error</text>
      <rect x="118" y="460" width="430" height="58" rx="10" fill="#143743" stroke="#35D3C9" stroke-width="2"/><text x="145" y="496" fill="#62E5DB" font-weight="700">3</text><text x="220" y="496" fill="#D8E3EF">server_fd</text>
      <rect x="118" y="532" width="430" height="58" rx="10" fill="#143743" stroke="#35D3C9" stroke-width="2"/><text x="145" y="568" fill="#62E5DB" font-weight="700">4</text><text x="220" y="568" fill="#D8E3EF">client_fd</text>
      <rect x="118" y="604" width="430" height="58" rx="10" fill="#3A2E1E" stroke="#F9B357" stroke-width="2"/><text x="145" y="640" fill="#F9B357" font-weight="700">5</text><text x="220" y="640" fill="#F8E6CE">log file</text>
    </g>

    <text x="760" y="207" fill="#F9B357" font-size="25" font-weight="700">Kernel-managed resources</text>
    <line x1="548" y1="489" x2="756" y2="315" stroke="#62E5DB" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="548" y1="561" x2="756" y2="481" stroke="#62E5DB" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="548" y1="633" x2="756" y2="625" stroke="#F9B357" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="770" y="250" width="620" height="132" rx="18" fill="#17314A" stroke="#35D3C9" stroke-width="3"/>
    <text x="808" y="296" fill="#62E5DB" font-size="25" font-weight="700">Listening socket object</text>
    <text x="808" y="332" fill="#D8E3EF" font-size="21">bound endpoint 0.0.0.0:2026</text>
    <text x="808" y="360" fill="#D8E3EF" font-size="21">connection queues and listening state</text>

    <rect x="770" y="414" width="620" height="132" rx="18" fill="#17314A" stroke="#35D3C9" stroke-width="3"/>
    <text x="808" y="460" fill="#62E5DB" font-size="25" font-weight="700">Connected TCP socket object</text>
    <text x="808" y="496" fill="#D8E3EF" font-size="21">one client/server byte stream</text>
    <text x="808" y="524" fill="#D8E3EF" font-size="21">receive buffer, send buffer, TCP state</text>

    <rect x="770" y="578" width="620" height="92" rx="18" fill="#3A2E1E" stroke="#F9B357" stroke-width="3"/>
    <text x="808" y="622" fill="#F9B357" font-size="25" font-weight="700">Open regular file</text>
    <text x="808" y="650" fill="#F8E6CE" font-size="21">current file position and access mode</text>
  </g>
</svg>
