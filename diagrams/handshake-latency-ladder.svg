<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" role="img" aria-labelledby="title desc">
  <title id="title">Round trips before application data for common transport and TLS combinations</title>
  <desc id="desc">TCP requires one round trip before normal application data, TLS adds cryptographic setup, and QUIC combines transport and TLS setup. Exact timing varies with versions, resumption, and early data.</desc>
  <rect width="1500" height="720" fill="#0B1220"/>
  <g font-family="Arial, sans-serif">
    <text x="70" y="70" fill="#F1F5F9" font-size="40" font-weight="700">Every required round trip delays the first useful response</text>
    <text x="70" y="108" fill="#A8B7CB" font-size="21">Conceptual full-handshake view; resumption and early-data modes can reduce these costs.</text>
    <g font-size="21">
      <text x="90" y="205" fill="#F1F5F9" font-weight="700">TCP</text><rect x="360" y="170" width="250" height="55" rx="10" fill="#17314A" stroke="#35D3C9" stroke-width="2"/><text x="485" y="205" text-anchor="middle" fill="#62E5DB">1 RTT: TCP setup</text>
      <text x="90" y="310" fill="#F1F5F9" font-weight="700">TCP + TLS 1.2</text><rect x="360" y="275" width="250" height="55" rx="10" fill="#17314A"/><rect x="620" y="275" width="250" height="55" rx="10" fill="#292543"/><rect x="880" y="275" width="250" height="55" rx="10" fill="#292543"/><text x="485" y="310" text-anchor="middle" fill="#62E5DB">TCP</text><text x="745" y="310" text-anchor="middle" fill="#C4B5FD">TLS</text><text x="1005" y="310" text-anchor="middle" fill="#C4B5FD">TLS</text>
      <text x="90" y="415" fill="#F1F5F9" font-weight="700">TCP + TLS 1.3</text><rect x="360" y="380" width="250" height="55" rx="10" fill="#17314A"/><rect x="620" y="380" width="250" height="55" rx="10" fill="#292543"/><text x="485" y="415" text-anchor="middle" fill="#62E5DB">TCP</text><text x="745" y="415" text-anchor="middle" fill="#C4B5FD">TLS</text>
      <text x="90" y="520" fill="#F1F5F9" font-weight="700">QUIC + TLS 1.3</text><rect x="360" y="485" width="250" height="55" rx="10" fill="#292543" stroke="#A78BFA" stroke-width="2"/><text x="485" y="520" text-anchor="middle" fill="#C4B5FD">combined setup</text>
    </g>
    <line x1="360" y1="590" x2="1240" y2="590" stroke="#64748B" stroke-width="3"/>
    <g fill="#A8B7CB" font-family="Arial, sans-serif" font-size="18" text-anchor="middle"><text x="360" y="625">start</text><text x="610" y="625">1 RTT</text><text x="870" y="625">2 RTT</text><text x="1130" y="625">3 RTT</text></g>
    <rect x="260" y="660" width="980" height="44" rx="10" fill="#3A2E1E"/><text x="750" y="689" text-anchor="middle" fill="#F9B357" font-size="19">Distance sets an RTT floor: bandwidth cannot overcome propagation delay.</text>
  </g>
</svg>
