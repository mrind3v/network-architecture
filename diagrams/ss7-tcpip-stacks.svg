<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860" role="img" aria-labelledby="title desc">
  <title id="title">SS7 stack compared with the Internet protocol stack</title>
  <desc id="desc">SS7 and Internet stacks contain layers with roughly comparable jobs, though their boundaries and trust assumptions differ.</desc>
  <rect width="1500" height="860" fill="#0B1220"/>
  <g font-family="Arial, sans-serif">
    <text x="70" y="70" fill="#F1F5F9" font-size="40" font-weight="700">Compare whole stacks, not SS7 with TCP alone</text>
    <text x="70" y="108" fill="#A8B7CB" font-size="21">Horizontal alignment means “similar job,” not “identical protocol.”</text>
    <text x="250" y="165" text-anchor="middle" fill="#F9B357" font-size="29" font-weight="700">SS7 family</text>
    <text x="1250" y="165" text-anchor="middle" fill="#62E5DB" font-size="29" font-weight="700">Internet family</text>
    <g font-size="21">
      <rect x="70" y="200" width="510" height="100" rx="14" fill="#3A2E1E" stroke="#F9B357" stroke-width="3"/><text x="100" y="239" fill="#F9B357" font-weight="700">MAP / ISUP / CAP</text><text x="100" y="272" fill="#D8E3EF">SMS, roaming, call setup, services</text>
      <rect x="920" y="200" width="510" height="100" rx="14" fill="#3A2E1E" stroke="#F9B357" stroke-width="3"/><text x="950" y="239" fill="#F9B357" font-weight="700">HTTP / DNS / SMTP / SIP</text><text x="950" y="272" fill="#D8E3EF">Application-specific meaning</text>
      <rect x="70" y="315" width="510" height="100" rx="14" fill="#292543" stroke="#A78BFA" stroke-width="3"/><text x="100" y="354" fill="#C4B5FD" font-weight="700">TCAP</text><text x="100" y="387" fill="#D8E3EF">Dialogues, requests, responses, components</text>
      <rect x="920" y="315" width="510" height="100" rx="14" fill="#292543" stroke="#A78BFA" stroke-width="3"/><text x="950" y="354" fill="#C4B5FD" font-weight="700">TLS + application framing</text><text x="950" y="387" fill="#D8E3EF">Security and conversations are layered or app-defined</text>
      <rect x="70" y="430" width="510" height="100" rx="14" fill="#143743" stroke="#35D3C9" stroke-width="3"/><text x="100" y="469" fill="#62E5DB" font-weight="700">SCCP</text><text x="100" y="502" fill="#D8E3EF">Subsystem addressing and optional connection service</text>
      <rect x="920" y="430" width="510" height="100" rx="14" fill="#143743" stroke="#35D3C9" stroke-width="3"/><text x="950" y="469" fill="#62E5DB" font-weight="700">TCP / UDP / QUIC*</text><text x="950" y="502" fill="#D8E3EF">Ports and process-to-process transport</text>
      <rect x="70" y="545" width="510" height="100" rx="14" fill="#172B45" stroke="#4AA8FF" stroke-width="3"/><text x="100" y="584" fill="#83C6FF" font-weight="700">MTP3</text><text x="100" y="617" fill="#D8E3EF">Point-code routing and link selection</text>
      <rect x="920" y="545" width="510" height="100" rx="14" fill="#172B45" stroke="#4AA8FF" stroke-width="3"/><text x="950" y="584" fill="#83C6FF" font-weight="700">IP</text><text x="950" y="617" fill="#D8E3EF">Best-effort packets and routing</text>
      <rect x="70" y="660" width="510" height="100" rx="14" fill="#17314A" stroke="#35D3C9" stroke-width="3"/><text x="100" y="699" fill="#62E5DB" font-weight="700">MTP2 / MTP1</text><text x="100" y="732" fill="#D8E3EF">Reliable signalling link over a bit-carrying medium</text>
      <rect x="920" y="660" width="510" height="100" rx="14" fill="#17314A" stroke="#35D3C9" stroke-width="3"/><text x="950" y="699" fill="#62E5DB" font-weight="700">Ethernet / Wi-Fi / fibre / radio</text><text x="950" y="732" fill="#D8E3EF">Local frames and physical transmission</text>
    </g>
    <g stroke="#64748B" stroke-width="2" stroke-dasharray="8 8"><line x1="580" y1="250" x2="920" y2="250"/><line x1="580" y1="365" x2="920" y2="365"/><line x1="580" y1="480" x2="920" y2="480"/><line x1="580" y1="595" x2="920" y2="595"/><line x1="580" y1="710" x2="920" y2="710"/></g>
    <text x="750" y="815" text-anchor="middle" fill="#A8B7CB" font-size="18">* QUIC runs over UDP but exposes transport-like streams.</text>
  </g>
</svg>
