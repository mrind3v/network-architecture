<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">Email submission, transfer, storage, and retrieval use different protocols</title>
  <desc id="desc">A sender's mail client submits a message to an outgoing server with SMTP. Servers relay it with SMTP. The recipient reads the stored mailbox with IMAP or POP3.</desc>
  <defs><marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0L12 6L0 12z" fill="#62E5DB"/></marker></defs>
  <rect width="1500" height="760" fill="#0B1220"/>
  <g font-family="Arial, sans-serif">
    <text x="70" y="70" fill="#F1F5F9" font-size="40" font-weight="700">“Email” is a workflow built from separate protocols</text>
    <text x="70" y="108" fill="#A8B7CB" font-size="21">SMTP pushes mail toward a mailbox; IMAP or POP3 lets the recipient access that mailbox.</text>
    <g font-size="21" text-anchor="middle">
      <rect x="55" y="205" width="250" height="105" rx="16" fill="#172B45" stroke="#4AA8FF" stroke-width="3"/><text x="180" y="246" fill="#83C6FF" font-weight="700">Sender's mail app</text><text x="180" y="279" fill="#D8E3EF">message composer</text>
      <rect x="420" y="205" width="250" height="105" rx="16" fill="#17314A" stroke="#35D3C9" stroke-width="3"/><text x="545" y="246" fill="#62E5DB" font-weight="700">Submission server</text><text x="545" y="279" fill="#D8E3EF">accepts authenticated mail</text>
      <rect x="830" y="205" width="250" height="105" rx="16" fill="#17314A" stroke="#35D3C9" stroke-width="3"/><text x="955" y="246" fill="#62E5DB" font-weight="700">Recipient mail server</text><text x="955" y="279" fill="#D8E3EF">stores mailbox</text>
      <rect x="1195" y="205" width="250" height="105" rx="16" fill="#172B45" stroke="#4AA8FF" stroke-width="3"/><text x="1320" y="246" fill="#83C6FF" font-weight="700">Recipient's mail app</text><text x="1320" y="279" fill="#D8E3EF">synchronizes or downloads</text>
    </g>
    <g stroke="#62E5DB" stroke-width="5" fill="none"><line x1="307" y1="257" x2="418" y2="257" marker-end="url(#a)"/><line x1="672" y1="257" x2="828" y2="257" marker-end="url(#a)"/><line x1="1082" y1="257" x2="1193" y2="257" marker-end="url(#a)"/></g>
    <g font-family="Arial, sans-serif" text-anchor="middle"><text x="362" y="225" fill="#F9B357" font-size="16" font-weight="700">SMTP submission</text><text x="750" y="225" fill="#F9B357" font-size="16" font-weight="700">SMTP relay</text><text x="1138" y="225" fill="#F9B357" font-size="16" font-weight="700">IMAP or POP3</text></g>
    <rect x="165" y="405" width="1170" height="245" rx="20" fill="#111C2E" stroke="#334155" stroke-width="2"/>
    <text x="220" y="457" fill="#F1F5F9" font-size="26" font-weight="700">The message has multiple layers of meaning</text>
    <text x="220" y="510" fill="#62E5DB" font-size="21" font-weight="700">SMTP envelope</text><text x="460" y="510" fill="#D8E3EF" font-size="21">MAIL FROM and RCPT TO control delivery</text>
    <text x="220" y="555" fill="#C4B5FD" font-size="21" font-weight="700">Message headers</text><text x="460" y="555" fill="#D8E3EF" font-size="21">From, To, Subject describe the letter shown to people</text>
    <text x="220" y="600" fill="#F9B357" font-size="21" font-weight="700">MIME body</text><text x="460" y="600" fill="#D8E3EF" font-size="21">boundaries and encodings carry text, HTML, and attachments</text>
    <text x="750" y="710" text-anchor="middle" fill="#A8B7CB" font-size="19">These layers can disagree: display headers are not the delivery envelope.</text>
  </g>
</svg>
