<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc"><title id="title">How a web server runs one CGI request</title><desc id="desc">The web server parses an HTTP request, creates pipes, forks and executes a CGI program, passes request metadata through environment variables and the request body through standard input, then reads headers and body from standard output and errors from standard error.</desc><defs><marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L12 6L0 12z" fill="#62E5DB"/></marker></defs><rect width="1500" height="820" fill="#0B1220"/><g font-family="Arial, sans-serif"><text x="70" y="70" fill="#F1F5F9" font-size="40" font-weight="700">CGI adapts one HTTP request into one operating-system process</text><text x="70" y="108" fill="#A8B7CB" font-size="21">HTTP stays on the client side; the child sees environment variables and standard streams.</text>
<g text-anchor="middle"><rect x="60" y="245" width="260" height="100" rx="17" fill="#172B45" stroke="#4AA8FF" stroke-width="3"/><text x="190" y="285" fill="#83C6FF" font-size="24" font-weight="700">HTTP client</text><text x="190" y="318" fill="#D8E3EF" font-size="18">request bytes over TCP</text><rect x="455" y="205" width="320" height="180" rx="20" fill="#143743" stroke="#35D3C9" stroke-width="3"/><text x="615" y="250" fill="#62E5DB" font-size="25" font-weight="700">Web server</text><text x="615" y="286" fill="#D8E3EF" font-size="18">parse HTTP + select script</text><text x="615" y="318" fill="#D8E3EF" font-size="18">create pipes, fork, exec</text><text x="615" y="350" fill="#D8E3EF" font-size="18">enforce timeout</text><rect x="1090" y="205" width="340" height="180" rx="20" fill="#281F45" stroke="#A78BFA" stroke-width="3"/><text x="1260" y="250" fill="#C4B5FD" font-size="25" font-weight="700">CGI child process</text><text x="1260" y="286" fill="#D8E3EF" font-size="18">read env + stdin</text><text x="1260" y="318" fill="#D8E3EF" font-size="18">write stdout + stderr</text><text x="1260" y="350" fill="#D8E3EF" font-size="18">exit after this request</text></g>
<g stroke="#62E5DB" stroke-width="4" fill="none" marker-end="url(#a)"><line x1="322" y1="295" x2="451" y2="295"/><line x1="777" y1="250" x2="1086" y2="250"/><line x1="1086" y1="330" x2="779" y2="330"/><line x1="453" y1="350" x2="324" y2="350"/></g><g font-size="17" font-weight="700"><text x="830" y="230" fill="#F9B357">envp + stdin pipe</text><text x="825" y="320" fill="#F9B357">stdout pipe</text><text x="340" y="280" fill="#F9B357">request</text><text x="340" y="378" fill="#F9B357">response</text></g>
<rect x="275" y="480" width="950" height="220" rx="20" fill="#111C2E" stroke="#334155" stroke-width="2"/><text x="320" y="530" fill="#F1F5F9" font-size="25" font-weight="700">What crosses the process boundary?</text><text x="320" y="580" fill="#62E5DB" font-size="20" font-weight="700">Environment</text><text x="505" y="580" fill="#D8E3EF" font-size="20">REQUEST_METHOD, QUERY_STRING, CONTENT_LENGTH, HTTP_USER_AGENT...</text><text x="320" y="625" fill="#C4B5FD" font-size="20" font-weight="700">stdin</text><text x="505" y="625" fill="#D8E3EF" font-size="20">request body bytes, up to CONTENT_LENGTH</text><text x="320" y="670" fill="#F9B357" font-size="20" font-weight="700">stdout</text><text x="505" y="670" fill="#D8E3EF" font-size="20">CGI response headers, blank line, response body</text><text x="750" y="765" text-anchor="middle" fill="#A8B7CB" font-size="19">The web server performs protocol translation and process supervision; the CGI program does not accept the client TCP connection.</text></g></svg>
