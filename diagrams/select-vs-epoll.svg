<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc"><title id="title">select and epoll compared</title><desc id="desc">Select sends and scans descriptor sets on each wait, while epoll keeps an interest set in the kernel and returns events for descriptors that became ready.</desc><rect width="1500" height="760" fill="#0B1220"/><g font-family="Arial, sans-serif"><text x="70" y="70" fill="#F1F5F9" font-size="40" font-weight="700">Same readiness idea, different bookkeeping cost</text><text x="70" y="108" fill="#A8B7CB" font-size="21">Both report I/O readiness. Neither parses HTTP nor performs your application work.</text>
  <rect x="70" y="165" width="650" height="490" rx="20" fill="#111C2E" stroke="#F9B357" stroke-width="3"/><text x="110" y="220" fill="#F9B357" font-size="31" font-weight="700">select()</text><text x="110" y="265" fill="#F1F5F9" font-size="22" font-weight="700">Every wait rebuilds and scans sets</text><g fill="#172B45"><rect x="110" y="310" width="550" height="55" rx="10"/><rect x="110" y="380" width="550" height="55" rx="10"/><rect x="110" y="450" width="550" height="55" rx="10"/></g><g fill="#D8E3EF" font-size="19"><text x="135" y="345">user: construct bitmaps + maxfd</text><text x="135" y="415">kernel: inspect descriptors up to maxfd</text><text x="135" y="485">user: scan returned sets for ready bits</text></g><text x="110" y="555" fill="#A8B7CB" font-size="19">Linux/glibc fd_set represents FDs 0-1023.</text><text x="110" y="590" fill="#A8B7CB" font-size="19">Other platforms and limits must be checked separately.</text>
  <rect x="780" y="165" width="650" height="490" rx="20" fill="#111C2E" stroke="#35D3C9" stroke-width="3"/><text x="820" y="220" fill="#62E5DB" font-size="31" font-weight="700">epoll</text><text x="820" y="265" fill="#F1F5F9" font-size="22" font-weight="700">Register interest, then receive events</text><g fill="#143743"><rect x="820" y="310" width="550" height="55" rx="10"/><rect x="820" y="380" width="550" height="55" rx="10"/><rect x="820" y="450" width="550" height="55" rx="10"/></g><g fill="#D8E3EF" font-size="19"><text x="845" y="345">epoll_ctl: add, modify, or remove an FD</text><text x="845" y="415">kernel: retain the interest set</text><text x="845" y="485">epoll_wait: return ready event records</text></g><text x="820" y="555" fill="#A8B7CB" font-size="19">Scales well when many watched FDs are idle.</text><text x="820" y="590" fill="#A8B7CB" font-size="19">Still pays memory, event handling, and application costs.</text><rect x="330" y="690" width="840" height="45" rx="10" fill="#153929"/><text x="750" y="719" text-anchor="middle" fill="#B5F5D4" font-size="20" font-weight="700">Performance depends on total watched FDs, ready FDs, and work done per event.</text></g></svg>
