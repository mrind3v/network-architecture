<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc"><title id="title">Traditional read and write compared with sendfile</title><desc id="desc">With read then write, file data is copied from kernel storage buffers into an application buffer and back to kernel socket buffers. Sendfile lets the kernel transfer file data toward the socket without copying it through the application buffer.</desc><defs><marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L12 6L0 12z" fill="#62E5DB"/></marker><marker id="b" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L12 6L0 12z" fill="#F9B357"/></marker></defs><rect width="1500" height="760" fill="#0B1220"/><g font-family="Arial, sans-serif"><text x="70" y="70" fill="#F1F5F9" font-size="40" font-weight="700">sendfile() removes the user-space data bounce</text><text x="70" y="108" fill="#A8B7CB" font-size="21">It avoids copying payload through the application's buffer; storage, kernel, protocol, and device work still remain.</text>
<text x="105" y="180" fill="#F9B357" font-size="26" font-weight="700">read() + write()</text><g text-anchor="middle"><rect x="90" y="230" width="300" height="100" rx="16" fill="#17314A" stroke="#35D3C9" stroke-width="3"/><text x="240" y="273" fill="#62E5DB" font-size="21" font-weight="700">Kernel file/page cache</text><text x="240" y="304" fill="#D8E3EF" font-size="18">file data</text><rect x="600" y="230" width="300" height="100" rx="16" fill="#281F45" stroke="#A78BFA" stroke-width="3"/><text x="750" y="273" fill="#C4B5FD" font-size="21" font-weight="700">Application buffer</text><text x="750" y="304" fill="#D8E3EF" font-size="18">user memory</text><rect x="1110" y="230" width="300" height="100" rx="16" fill="#17314A" stroke="#35D3C9" stroke-width="3"/><text x="1260" y="273" fill="#62E5DB" font-size="21" font-weight="700">Kernel socket path</text><text x="1260" y="304" fill="#D8E3EF" font-size="18">send buffer / networking</text></g><g stroke="#F9B357" stroke-width="5" fill="none" marker-end="url(#b)"><line x1="392" y1="280" x2="596" y2="280"/><line x1="902" y1="280" x2="1106" y2="280"/></g><text x="495" y="258" text-anchor="middle" fill="#F9B357" font-size="17" font-weight="700">copy to user</text><text x="1005" y="258" text-anchor="middle" fill="#F9B357" font-size="17" font-weight="700">copy back</text>
<text x="105" y="445" fill="#62E5DB" font-size="26" font-weight="700">sendfile()</text><g text-anchor="middle"><rect x="220" y="490" width="360" height="110" rx="16" fill="#17314A" stroke="#35D3C9" stroke-width="3"/><text x="400" y="537" fill="#62E5DB" font-size="21" font-weight="700">Kernel file/page cache</text><text x="400" y="570" fill="#D8E3EF" font-size="18">input file descriptor</text><rect x="920" y="490" width="360" height="110" rx="16" fill="#17314A" stroke="#35D3C9" stroke-width="3"/><text x="1100" y="537" fill="#62E5DB" font-size="21" font-weight="700">Kernel socket path</text><text x="1100" y="570" fill="#D8E3EF" font-size="18">output socket descriptor</text></g><line x1="582" y1="545" x2="916" y2="545" stroke="#62E5DB" stroke-width="6" marker-end="url(#a)"/><text x="750" y="523" text-anchor="middle" fill="#B5F5D4" font-size="18" font-weight="700">no application payload buffer</text><rect x="300" y="660" width="900" height="50" rx="11" fill="#153929"/><text x="750" y="692" text-anchor="middle" fill="#B5F5D4" font-size="20" font-weight="700">Fewer copies and calls can reduce CPU cost for static-file responses.</text></g></svg>
