<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="790" viewBox="0 0 1500 790" role="img" aria-labelledby="title desc">
  <title id="title">Three server concurrency models</title>
  <desc id="desc">Fork per connection creates a process per client, thread per connection creates a thread per client, and an event loop lets one thread watch many sockets and work only on ready ones.</desc>
  <rect width="1500" height="790" fill="#0B1220"/><g font-family="Arial, sans-serif">
    <text x="70" y="70" fill="#F1F5F9" font-size="40" font-weight="700">Three ways to hold many client connections</text>
    <text x="70" y="108" fill="#A8B7CB" font-size="21">Concurrency means several conversations are in progress; it does not require several CPU instructions at the same instant.</text>
    <g font-size="20">
      <rect x="55" y="160" width="430" height="520" rx="20" fill="#111C2E" stroke="#F9B357" stroke-width="3"/><text x="90" y="212" fill="#F9B357" font-size="29" font-weight="700">Process per connection</text>
      <g fill="#172B45" stroke="#4AA8FF" stroke-width="2"><rect x="90" y="260" width="110" height="75" rx="12"/><rect x="215" y="260" width="110" height="75" rx="12"/><rect x="340" y="260" width="110" height="75" rx="12"/></g>
      <g fill="#83C6FF" text-anchor="middle" font-weight="700"><text x="145" y="305">P1</text><text x="270" y="305">P2</text><text x="395" y="305">P3</text></g>
      <text x="90" y="390" fill="#D8E3EF">Each client owns a process.</text><text x="90" y="430" fill="#D8E3EF">Strong isolation, high setup cost.</text><text x="90" y="470" fill="#D8E3EF">Each process has scheduler state,</text><text x="90" y="505" fill="#D8E3EF">an FD table and virtual memory.</text>
      <rect x="535" y="160" width="430" height="520" rx="20" fill="#111C2E" stroke="#A78BFA" stroke-width="3"/><text x="570" y="212" fill="#C4B5FD" font-size="29" font-weight="700">Thread per connection</text>
      <rect x="570" y="252" width="360" height="102" rx="14" fill="#281F45" stroke="#A78BFA" stroke-width="2"/><text x="750" y="285" text-anchor="middle" fill="#E9D5FF" font-weight="700">One process</text><text x="750" y="327" text-anchor="middle" fill="#D8E3EF">T1 &#160;&#160; T2 &#160;&#160; T3</text>
      <text x="570" y="390" fill="#D8E3EF">Threads share process memory.</text><text x="570" y="430" fill="#D8E3EF">Cheaper than processes, but each</text><text x="570" y="470" fill="#D8E3EF">needs a stack and scheduler state.</text><text x="570" y="510" fill="#D8E3EF">Shared state needs synchronization.</text>
      <rect x="1015" y="160" width="430" height="520" rx="20" fill="#111C2E" stroke="#35D3C9" stroke-width="3"/><text x="1050" y="212" fill="#62E5DB" font-size="29" font-weight="700">One readiness loop</text>
      <rect x="1060" y="252" width="340" height="102" rx="14" fill="#143743" stroke="#35D3C9" stroke-width="2"/><text x="1230" y="286" text-anchor="middle" fill="#B5F5D4" font-weight="700">one thread</text><text x="1230" y="327" text-anchor="middle" fill="#D8E3EF">FD 7 &#160; FD 9 &#160; FD 12 &#160; ...</text>
      <text x="1050" y="390" fill="#D8E3EF">The kernel reports ready FDs.</text><text x="1050" y="430" fill="#D8E3EF">Idle sockets do not own a thread.</text><text x="1050" y="470" fill="#D8E3EF">The loop must never perform long,</text><text x="1050" y="505" fill="#D8E3EF">blocking work itself.</text>
    </g>
    <rect x="260" y="715" width="980" height="48" rx="11" fill="#153929"/><text x="750" y="746" text-anchor="middle" fill="#B5F5D4" font-size="20" font-weight="700">Production systems often combine a small worker pool with an event loop inside each worker.</text>
  </g>
</svg>
