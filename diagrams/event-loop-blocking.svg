<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" role="img" aria-labelledby="title desc"><title id="title">One blocking operation stalls an event loop</title><desc id="desc">Three ready clients wait behind one long operation when a single event-loop thread blocks. Offloading the long operation lets the loop continue handling the other clients.</desc><rect width="1500" height="720" fill="#0B1220"/><g font-family="Arial, sans-serif"><text x="70" y="70" fill="#F1F5F9" font-size="40" font-weight="700">The event loop scales only when each turn stays short</text><text x="70" y="108" fill="#A8B7CB" font-size="21">Readiness prevents waiting for socket I/O; it does not make disk access, DNS, locks, or application code non-blocking.</text>
<text x="95" y="175" fill="#F9B357" font-size="25" font-weight="700">Blocking inside the loop</text><line x1="180" y1="235" x2="1380" y2="235" stroke="#334155" stroke-width="4"/><g><rect x="180" y="205" width="170" height="60" rx="9" fill="#143743"/><rect x="360" y="205" width="660" height="60" rx="9" fill="#6B2B31"/><rect x="1030" y="205" width="150" height="60" rx="9" fill="#334155"/><rect x="1190" y="205" width="150" height="60" rx="9" fill="#334155"/></g><g text-anchor="middle" font-size="18" font-weight="700"><text x="265" y="242" fill="#B5F5D4">client A</text><text x="690" y="242" fill="#FECACA">slow disk read</text><text x="1105" y="242" fill="#CBD5E1">B waits</text><text x="1265" y="242" fill="#CBD5E1">C waits</text></g>
<text x="95" y="355" fill="#62E5DB" font-size="25" font-weight="700">Slow work offloaded</text><line x1="180" y1="415" x2="1380" y2="415" stroke="#334155" stroke-width="4"/><g><rect x="180" y="385" width="170" height="60" rx="9" fill="#143743"/><rect x="360" y="385" width="170" height="60" rx="9" fill="#172B45"/><rect x="540" y="385" width="170" height="60" rx="9" fill="#143743"/><rect x="720" y="385" width="170" height="60" rx="9" fill="#143743"/><rect x="900" y="385" width="220" height="60" rx="9" fill="#172B45"/></g><g text-anchor="middle" font-size="18" font-weight="700"><text x="265" y="422" fill="#B5F5D4">client A</text><text x="445" y="422" fill="#83C6FF">submit work</text><text x="625" y="422" fill="#B5F5D4">client B</text><text x="805" y="422" fill="#B5F5D4">client C</text><text x="1010" y="422" fill="#83C6FF">resume A later</text></g>
<rect x="360" y="500" width="660" height="100" rx="16" fill="#3A2E1E" stroke="#F9B357" stroke-width="2"/><text x="690" y="540" text-anchor="middle" fill="#F9B357" font-size="21" font-weight="700">Bounded helper pool</text><text x="690" y="573" text-anchor="middle" fill="#F8E6CE" font-size="18">performs disk/CPU work and reports completion</text><line x1="445" y1="450" x2="540" y2="497" stroke="#F9B357" stroke-width="3"/><line x1="900" y1="497" x2="1010" y2="450" stroke="#F9B357" stroke-width="3"/><text x="750" y="665" text-anchor="middle" fill="#A8B7CB" font-size="19">A timeout limits how long you wait; it does not automatically make a blocking handler safe.</text></g></svg>
