<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" role="img" aria-labelledby="title desc">
  <title id="title">Loss-based congestion control compared with BBR's model-based approach</title>
  <desc id="desc">A loss-based sender increases its sending rate until loss and then reduces it, creating a sawtooth. BBR estimates bottleneck bandwidth and minimum round-trip time and paces near the estimated path capacity.</desc>
  <rect width="1500" height="720" fill="#0B1220"/>
  <g font-family="Arial, sans-serif">
    <text x="70" y="70" fill="#F1F5F9" font-size="40" font-weight="700">Congestion control answers: how fast should this sender inject data?</text>
    <text x="70" y="108" fill="#A8B7CB" font-size="21">The algorithms infer path capacity differently; neither can see every router queue directly.</text>
    <rect x="75" y="165" width="635" height="430" rx="18" fill="#111C2E" stroke="#FB7185" stroke-width="3"/>
    <text x="115" y="215" fill="#FDA4AF" font-size="28" font-weight="700">Loss-based idea (Reno/CUBIC)</text>
    <line x1="135" y1="520" x2="650" y2="520" stroke="#64748B" stroke-width="2"/><line x1="135" y1="520" x2="135" y2="275" stroke="#64748B" stroke-width="2"/>
    <path d="M135 500 L260 310 L270 470 L410 285 L420 455 L560 300 L570 465 L650 350" fill="none" stroke="#FB7185" stroke-width="5"/>
    <text x="392" y="560" text-anchor="middle" fill="#A8B7CB" font-size="18">time</text><text x="108" y="402" transform="rotate(-90 108 402)" text-anchor="middle" fill="#A8B7CB" font-size="18">sending rate</text>
    <text x="115" y="630" fill="#D8E3EF" font-size="20">Grow, observe loss, reduce, then grow again.</text>

    <rect x="790" y="165" width="635" height="430" rx="18" fill="#111C2E" stroke="#35D3C9" stroke-width="3"/>
    <text x="830" y="215" fill="#62E5DB" font-size="28" font-weight="700">BBR's model-based idea</text>
    <line x1="850" y1="520" x2="1365" y2="520" stroke="#64748B" stroke-width="2"/><line x1="850" y1="520" x2="850" y2="275" stroke="#64748B" stroke-width="2"/>
    <line x1="850" y1="340" x2="1365" y2="340" stroke="#F9B357" stroke-width="3" stroke-dasharray="10 8"/>
    <path d="M850 500 C910 430 940 330 1010 350 S1140 325 1210 345 S1300 330 1365 340" fill="none" stroke="#62E5DB" stroke-width="5"/>
    <text x="1110" y="320" text-anchor="middle" fill="#F9B357" font-size="18">estimated bottleneck rate</text>
    <text x="1108" y="560" text-anchor="middle" fill="#A8B7CB" font-size="18">time</text><text x="823" y="402" transform="rotate(-90 823 402)" text-anchor="middle" fill="#A8B7CB" font-size="18">sending rate</text>
    <text x="830" y="630" fill="#D8E3EF" font-size="20">Estimate bandwidth and minimum RTT; pace around the model.</text>
    <rect x="250" y="668" width="1000" height="38" rx="9" fill="#3A2E1E"/><text x="750" y="694" text-anchor="middle" fill="#F9B357" font-size="18">Flow control protects the receiver. Congestion control protects the network path.</text>
  </g>
</svg>
