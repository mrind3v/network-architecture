<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="790" viewBox="0 0 1500 790" role="img" aria-labelledby="title desc">
  <title id="title">Encapsulation by a sender and decapsulation by a receiver</title>
  <desc id="desc">Application data is wrapped by TCP, IP, and Ethernet headers while sending. The receiver removes and interprets those headers in reverse order.</desc>
  <defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0L12 6L0 12z" fill="#A8B7CB"/></marker></defs>
  <rect width="1500" height="790" fill="#0B1220"/>
  <g font-family="Arial, sans-serif">
    <text x="70" y="72" fill="#F1F5F9" font-size="40" font-weight="700">Encapsulation is nested packaging</text>
    <text x="70" y="110" fill="#A8B7CB" font-size="21">Each layer treats everything above it as payload.</text>
    <text x="145" y="165" fill="#62E5DB" font-size="27" font-weight="700">Sender: add headers</text>
    <text x="1085" y="165" fill="#83C6FF" font-size="27" font-weight="700">Receiver: remove headers</text>
    <g font-size="20" text-anchor="middle">
      <rect x="90" y="205" width="420" height="74" rx="12" fill="#3A2E1E" stroke="#F9B357" stroke-width="3"/><text x="300" y="250" fill="#F9B357">HTTP bytes</text>
      <line x1="300" y1="282" x2="300" y2="320" stroke="#A8B7CB" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="90" y="333" width="420" height="74" rx="12" fill="#143743" stroke="#35D3C9" stroke-width="3"/><text x="300" y="378" fill="#62E5DB">TCP header | HTTP bytes</text>
      <line x1="300" y1="410" x2="300" y2="448" stroke="#A8B7CB" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="90" y="461" width="420" height="74" rx="12" fill="#172B45" stroke="#4AA8FF" stroke-width="3"/><text x="300" y="506" fill="#83C6FF">IP header | TCP segment</text>
      <line x1="300" y1="538" x2="300" y2="576" stroke="#A8B7CB" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="90" y="589" width="420" height="74" rx="12" fill="#17314A" stroke="#35D3C9" stroke-width="3"/><text x="300" y="634" fill="#E6EEF8">Ethernet header | IP packet | trailer</text>

      <rect x="990" y="205" width="420" height="74" rx="12" fill="#3A2E1E" stroke="#F9B357" stroke-width="3"/><text x="1200" y="250" fill="#F9B357">HTTP parser receives bytes</text>
      <line x1="1200" y1="320" x2="1200" y2="282" stroke="#A8B7CB" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="990" y="333" width="420" height="74" rx="12" fill="#143743" stroke="#35D3C9" stroke-width="3"/><text x="1200" y="378" fill="#62E5DB">TCP orders bytes and removes header</text>
      <line x1="1200" y1="448" x2="1200" y2="410" stroke="#A8B7CB" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="990" y="461" width="420" height="74" rx="12" fill="#172B45" stroke="#4AA8FF" stroke-width="3"/><text x="1200" y="506" fill="#83C6FF">IP accepts packet and removes header</text>
      <line x1="1200" y1="576" x2="1200" y2="538" stroke="#A8B7CB" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="990" y="589" width="420" height="74" rx="12" fill="#17314A" stroke="#35D3C9" stroke-width="3"/><text x="1200" y="634" fill="#E6EEF8">NIC receives an Ethernet frame</text>
    </g>
    <line x1="522" y1="626" x2="978" y2="626" stroke="#FB7185" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="750" y="603" text-anchor="middle" fill="#FDA4AF" font-size="22" font-weight="700">signals cross one physical link</text>
    <rect x="560" y="260" width="380" height="230" rx="18" fill="#111C2E" stroke="#334155" stroke-width="2"/>
    <text x="750" y="315" text-anchor="middle" fill="#F1F5F9" font-size="27" font-weight="700">Vocabulary changes by layer</text>
    <text x="610" y="365" fill="#F9B357" font-size="21">L7</text><text x="690" y="365" fill="#D8E3EF" font-size="21">message / data</text>
    <text x="610" y="405" fill="#62E5DB" font-size="21">L4</text><text x="690" y="405" fill="#D8E3EF" font-size="21">TCP segment / UDP datagram</text>
    <text x="610" y="445" fill="#83C6FF" font-size="21">L3</text><text x="690" y="445" fill="#D8E3EF" font-size="21">IP packet</text>
    <text x="610" y="485" fill="#62E5DB" font-size="21">L2</text><text x="690" y="485" fill="#D8E3EF" font-size="21">frame</text>
  </g>
</svg>
