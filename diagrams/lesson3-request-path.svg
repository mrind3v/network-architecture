<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc"><title id="title">One complete dynamic request through an event-driven web server and FastCGI</title><desc id="desc">A client establishes TCP and optionally TLS, sends HTTP bytes, the kernel marks the socket ready, an event-loop worker reads and parses the request, routes it to a persistent FastCGI worker using typed records, receives output records, creates an HTTP response, writes bytes when the client socket is writable, and either keeps the TCP connection alive or closes it.</desc><defs><marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L12 6L0 12z" fill="#62E5DB"/></marker></defs><rect width="1500" height="900" fill="#0B1220"/><g font-family="Arial, sans-serif"><text x="70" y="65" fill="#F1F5F9" font-size="39" font-weight="700">One dynamic request: readiness, protocols, and application work</text><text x="70" y="103" fill="#A8B7CB" font-size="21">Each boundary changes who owns the bytes and which protocol gives them meaning.</text>
<g text-anchor="middle"><rect x="55" y="180" width="250" height="110" rx="17" fill="#172B45" stroke="#4AA8FF" stroke-width="3"/><text x="180" y="222" fill="#83C6FF" font-size="23" font-weight="700">1. Client</text><text x="180" y="254" fill="#D8E3EF" font-size="18">TCP/TLS + HTTP bytes</text><rect x="410" y="180" width="280" height="110" rx="17" fill="#17314A" stroke="#35D3C9" stroke-width="3"/><text x="550" y="222" fill="#62E5DB" font-size="23" font-weight="700">2. Kernel socket</text><text x="550" y="254" fill="#D8E3EF" font-size="18">receive buffer becomes readable</text><rect x="795" y="180" width="300" height="110" rx="17" fill="#143743" stroke="#35D3C9" stroke-width="3"/><text x="945" y="222" fill="#62E5DB" font-size="23" font-weight="700">3. Web worker loop</text><text x="945" y="254" fill="#D8E3EF" font-size="18">epoll_wait returns client FD</text><rect x="1200" y="180" width="250" height="110" rx="17" fill="#281F45" stroke="#A78BFA" stroke-width="3"/><text x="1325" y="222" fill="#C4B5FD" font-size="23" font-weight="700">4. HTTP parser</text><text x="1325" y="254" fill="#D8E3EF" font-size="18">method, path, headers, body</text></g><g stroke="#62E5DB" stroke-width="4" fill="none" marker-end="url(#a)"><line x1="307" y1="235" x2="406" y2="235"/><line x1="692" y1="235" x2="791" y2="235"/><line x1="1097" y1="235" x2="1196" y2="235"/></g>
<g text-anchor="middle"><rect x="1055" y="405" width="350" height="125" rx="18" fill="#143743" stroke="#35D3C9" stroke-width="3"/><text x="1230" y="447" fill="#62E5DB" font-size="22" font-weight="700">5. FastCGI client</text><text x="1230" y="482" fill="#D8E3EF" font-size="18">serialize PARAMS + STDIN records</text><text x="1230" y="510" fill="#A8B7CB" font-size="17">persistent local socket</text><rect x="575" y="405" width="350" height="125" rx="18" fill="#281F45" stroke="#A78BFA" stroke-width="3"/><text x="750" y="447" fill="#C4B5FD" font-size="22" font-weight="700">6. Application worker</text><text x="750" y="482" fill="#D8E3EF" font-size="18">run route/business logic</text><text x="750" y="510" fill="#A8B7CB" font-size="17">database/cache may add waits</text><rect x="95" y="405" width="350" height="125" rx="18" fill="#3A2E1E" stroke="#F9B357" stroke-width="3"/><text x="270" y="447" fill="#F9B357" font-size="22" font-weight="700">7. FastCGI response</text><text x="270" y="482" fill="#D8E3EF" font-size="18">STDOUT + END_REQUEST records</text><text x="270" y="510" fill="#A8B7CB" font-size="17">STDERR is logged, not sent as body</text></g><g stroke="#62E5DB" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M1325 292 C1325 340 1260 355 1230 401"/><line x1="1051" y1="467" x2="929" y2="467"/><line x1="571" y1="467" x2="449" y2="467"/></g>
<g text-anchor="middle"><rect x="95" y="650" width="350" height="120" rx="18" fill="#143743" stroke="#35D3C9" stroke-width="3"/><text x="270" y="692" fill="#62E5DB" font-size="22" font-weight="700">8. Build HTTP response</text><text x="270" y="727" fill="#D8E3EF" font-size="18">status + headers + body framing</text><rect x="575" y="650" width="350" height="120" rx="18" fill="#17314A" stroke="#35D3C9" stroke-width="3"/><text x="750" y="692" fill="#62E5DB" font-size="22" font-weight="700">9. Write when ready</text><text x="750" y="727" fill="#D8E3EF" font-size="18">handle partial writes + buffering</text><rect x="1055" y="650" width="350" height="120" rx="18" fill="#172B45" stroke="#4AA8FF" stroke-width="3"/><text x="1230" y="692" fill="#83C6FF" font-size="22" font-weight="700">10. Client receives</text><text x="1230" y="727" fill="#D8E3EF" font-size="18">reuse keep-alive or close TCP</text></g><g stroke="#62E5DB" stroke-width="4" fill="none" marker-end="url(#a)"><line x1="270" y1="532" x2="270" y2="646"/><line x1="449" y1="710" x2="571" y2="710"/><line x1="929" y1="710" x2="1051" y2="710"/></g><rect x="250" y="820" width="1000" height="48" rx="11" fill="#153929"/><text x="750" y="851" text-anchor="middle" fill="#B5F5D4" font-size="20" font-weight="700">No single component “understands everything”: each layer performs one bounded responsibility.</text></g></svg>
