<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">A read call crosses from a user process into the kernel</title>
  <desc id="desc">The server calls the C library read function in user space. A system call crosses the protection boundary, the kernel uses the file descriptor to find a socket, and bytes and a result return to the process.</desc>
  <defs>
    <marker id="down" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#62E5DB"/></marker>
    <marker id="up" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#F9B357"/></marker>
  </defs>
  <rect width="1500" height="760" fill="#0B1220"/>
  <g font-family="Arial, sans-serif">
    <text x="76" y="76" fill="#F1F5F9" font-size="40" font-weight="700">What happens when the server calls read(fd, ...)</text>
    <rect x="76" y="122" width="1348" height="250" rx="20" fill="#172B45" stroke="#4AA8FF" stroke-width="3"/>
    <text x="110" y="168" fill="#83C6FF" font-size="24" font-weight="700">USER SPACE — restricted application code</text>

    <rect x="120" y="210" width="350" height="106" rx="16" fill="#17314A" stroke="#35D3C9" stroke-width="3"/>
    <text x="156" y="252" fill="#62E5DB" font-size="25" font-weight="700">1. Server code</text>
    <text x="156" y="286" fill="#D8E3EF" font-size="21">read(4, buffer, 4096)</text>

    <line x1="470" y1="263" x2="570" y2="263" stroke="#62E5DB" stroke-width="4" marker-end="url(#down)"/>
    <rect x="578" y="210" width="370" height="106" rx="16" fill="#17314A" stroke="#35D3C9" stroke-width="3"/>
    <text x="614" y="252" fill="#62E5DB" font-size="25" font-weight="700">2. C library wrapper</text>
    <text x="614" y="286" fill="#D8E3EF" font-size="21">prepares the kernel request</text>

    <line x1="948" y1="263" x2="1048" y2="263" stroke="#62E5DB" stroke-width="4" marker-end="url(#down)"/>
    <rect x="1056" y="210" width="310" height="106" rx="16" fill="#222B4D" stroke="#A78BFA" stroke-width="3"/>
    <text x="1092" y="252" fill="#C4B5FD" font-size="25" font-weight="700">3. CPU transition</text>
    <text x="1092" y="286" fill="#D8E3EF" font-size="21">enter privileged mode</text>

    <line x1="76" y1="402" x2="1424" y2="402" stroke="#F9B357" stroke-width="3" stroke-dasharray="12 10"/>
    <rect x="568" y="376" width="365" height="52" rx="25" fill="#3A2E1E" stroke="#F9B357" stroke-width="2"/>
    <text x="619" y="410" fill="#F9B357" font-size="21" font-weight="700">SYSTEM-CALL BOUNDARY</text>

    <rect x="76" y="452" width="1348" height="230" rx="20" fill="#111C2E" stroke="#2A455F" stroke-width="3"/>
    <text x="110" y="500" fill="#F9B357" font-size="24" font-weight="700">KERNEL SPACE — operating-system control</text>
    <rect x="120" y="540" width="390" height="96" rx="16" fill="#3A2E1E" stroke="#F9B357" stroke-width="3"/>
    <text x="154" y="580" fill="#F9B357" font-size="24" font-weight="700">4. Validate arguments</text>
    <text x="154" y="612" fill="#F8E6CE" font-size="20">FD 4 and buffer are checked</text>
    <line x1="510" y1="588" x2="612" y2="588" stroke="#F9B357" stroke-width="4" marker-end="url(#up)"/>
    <rect x="620" y="540" width="390" height="96" rx="16" fill="#3A2E1E" stroke="#F9B357" stroke-width="3"/>
    <text x="654" y="580" fill="#F9B357" font-size="24" font-weight="700">5. Follow FD 4</text>
    <text x="654" y="612" fill="#F8E6CE" font-size="20">find the connected socket</text>
    <line x1="1010" y1="588" x2="1112" y2="588" stroke="#F9B357" stroke-width="4" marker-end="url(#up)"/>
    <rect x="1120" y="540" width="246" height="96" rx="16" fill="#143743" stroke="#35D3C9" stroke-width="3"/>
    <text x="1152" y="580" fill="#62E5DB" font-size="24" font-weight="700">6. Return</text>
    <text x="1152" y="612" fill="#D8E3EF" font-size="20">bytes + count</text>
  </g>
</svg>
