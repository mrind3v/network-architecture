<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1500 780" role="img" aria-labelledby="title desc">
  <title id="title">Fork lets the parent accept while a child serves one connection</title>
  <desc id="desc">Before fork the parent has listening descriptor 3 and connected descriptor 4. After fork both descriptor tables initially refer to the same kernel sockets. The parent closes descriptor 4 and returns to accept, while the child closes descriptor 3 and handles descriptor 4.</desc>
  <defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#62E5DB"/></marker></defs>
  <rect width="1500" height="780" fill="#0B1220"/>
  <g font-family="Arial, sans-serif">
    <text x="76" y="76" fill="#F1F5F9" font-size="40" font-weight="700">fork() splits responsibilities, not the TCP connection</text>

    <rect x="76" y="126" width="410" height="220" rx="20" fill="#172B45" stroke="#4AA8FF" stroke-width="3"/>
    <text x="112" y="172" fill="#83C6FF" font-size="25" font-weight="700">Before fork — parent</text>
    <rect x="112" y="210" width="338" height="48" rx="10" fill="#143743"/><text x="137" y="241" fill="#D8E3EF" font-size="20">FD 3 → listening socket</text>
    <rect x="112" y="273" width="338" height="48" rx="10" fill="#143743"/><text x="137" y="304" fill="#D8E3EF" font-size="20">FD 4 → connection A</text>

    <line x1="486" y1="236" x2="602" y2="236" stroke="#62E5DB" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="610" y="190" width="190" height="92" rx="46" fill="#143743" stroke="#35D3C9" stroke-width="3"/>
    <text x="652" y="246" fill="#62E5DB" font-size="26" font-weight="700">fork()</text>
    <line x1="800" y1="220" x2="930" y2="172" stroke="#62E5DB" stroke-width="5" marker-end="url(#arrow)"/>
    <line x1="800" y1="252" x2="930" y2="430" stroke="#62E5DB" stroke-width="5" marker-end="url(#arrow)"/>

    <rect x="942" y="116" width="482" height="236" rx="20" fill="#172B45" stroke="#4AA8FF" stroke-width="3"/>
    <text x="978" y="162" fill="#83C6FF" font-size="25" font-weight="700">Parent path</text>
    <text x="978" y="201" fill="#D8E3EF" font-size="20">Initially inherits both FD references</text>
    <rect x="978" y="226" width="410" height="44" rx="9" fill="#143743"/><text x="1002" y="255" fill="#62E5DB" font-size="19">keep FD 3 → call accept() again</text>
    <rect x="978" y="282" width="410" height="44" rx="9" fill="#3A2E1E"/><text x="1002" y="311" fill="#F9B357" font-size="19">close parent copy of FD 4</text>

    <rect x="942" y="400" width="482" height="236" rx="20" fill="#222B4D" stroke="#A78BFA" stroke-width="3"/>
    <text x="978" y="446" fill="#C4B5FD" font-size="25" font-weight="700">Child path</text>
    <text x="978" y="485" fill="#D8E3EF" font-size="20">Initially inherits both FD references</text>
    <rect x="978" y="510" width="410" height="44" rx="9" fill="#3A2E1E"/><text x="1002" y="539" fill="#F9B357" font-size="19">close child copy of FD 3</text>
    <rect x="978" y="566" width="410" height="44" rx="9" fill="#143743"/><text x="1002" y="595" fill="#62E5DB" font-size="19">keep FD 4 → handle connection A</text>

    <rect x="76" y="420" width="694" height="216" rx="20" fill="#111C2E" stroke="#2A455F" stroke-width="3"/>
    <text x="112" y="466" fill="#F9B357" font-size="25" font-weight="700">Kernel socket objects remain shared</text>
    <rect x="112" y="504" width="286" height="80" rx="14" fill="#17314A" stroke="#35D3C9" stroke-width="2"/>
    <text x="142" y="539" fill="#62E5DB" font-size="21" font-weight="700">Listening socket</text>
    <text x="142" y="568" fill="#D8E3EF" font-size="19">parent keeps reference</text>
    <rect x="436" y="504" width="298" height="80" rx="14" fill="#222B4D" stroke="#A78BFA" stroke-width="2"/>
    <text x="466" y="539" fill="#C4B5FD" font-size="21" font-weight="700">Connection A socket</text>
    <text x="466" y="568" fill="#D8E3EF" font-size="19">child keeps reference</text>

    <rect x="76" y="688" width="1348" height="58" rx="14" fill="#143743"/>
    <text x="112" y="725" fill="#62E5DB" font-size="22">While the child may block in read(), the parent can accept connection B. The scheduler lets both processes make progress.</text>
  </g>
</svg>
