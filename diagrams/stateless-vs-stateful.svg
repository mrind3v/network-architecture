<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="790" viewBox="0 0 1500 790" role="img" aria-labelledby="title desc"><title id="title">Stateless requests and stateful services scale differently</title><desc id="desc">For a stateless request, a load balancer can choose any equivalent application server if necessary state is shared elsewhere. Stateful services maintain session or connection state, so placement, ownership, replication, and failover become part of the design.</desc><rect width="1500" height="790" fill="#0B1220"/><g font-family="Arial, sans-serif"><text x="70" y="70" fill="#F1F5F9" font-size="40" font-weight="700">Protocol statelessness does not remove application state</text><text x="70" y="108" fill="#A8B7CB" font-size="21">HTTP messages are self-describing requests, but login sessions, carts, caches, databases, and long-lived connections still create state.</text>
<rect x="65" y="165" width="660" height="500" rx="20" fill="#111C2E" stroke="#35D3C9" stroke-width="3"/><text x="105" y="220" fill="#62E5DB" font-size="29" font-weight="700">Stateless application tier</text><text x="105" y="258" fill="#D8E3EF" font-size="19">Any healthy replica can handle the next request if shared state is external.</text><rect x="110" y="315" width="190" height="70" rx="12" fill="#172B45"/><rect x="345" y="315" width="145" height="70" rx="12" fill="#143743"/><rect x="535" y="285" width="145" height="55" rx="10" fill="#143743"/><rect x="535" y="355" width="145" height="55" rx="10" fill="#143743"/><text x="205" y="358" text-anchor="middle" fill="#83C6FF" font-size="19" font-weight="700">load balancer</text><text x="418" y="358" text-anchor="middle" fill="#B5F5D4" font-size="19">app A</text><text x="607" y="319" text-anchor="middle" fill="#B5F5D4" font-size="18">app B</text><text x="607" y="389" text-anchor="middle" fill="#B5F5D4" font-size="18">app C</text><rect x="265" y="500" width="280" height="80" rx="14" fill="#281F45" stroke="#A78BFA" stroke-width="2"/><text x="405" y="534" text-anchor="middle" fill="#C4B5FD" font-size="19" font-weight="700">shared database/session store</text><text x="405" y="563" text-anchor="middle" fill="#D8E3EF" font-size="17">durable state lives elsewhere</text>
<rect x="775" y="165" width="660" height="500" rx="20" fill="#111C2E" stroke="#F9B357" stroke-width="3"/><text x="815" y="220" fill="#F9B357" font-size="29" font-weight="700">Stateful connection or service</text><text x="815" y="258" fill="#D8E3EF" font-size="19">A live session may have an owner, ordered history, authentication, or local data.</text><rect x="835" y="315" width="190" height="70" rx="12" fill="#172B45"/><rect x="1110" y="290" width="235" height="120" rx="14" fill="#3A2E1E" stroke="#F9B357" stroke-width="2"/><text x="930" y="358" text-anchor="middle" fill="#83C6FF" font-size="19" font-weight="700">client connection</text><text x="1228" y="330" text-anchor="middle" fill="#F9B357" font-size="19" font-weight="700">current owner</text><text x="1228" y="362" text-anchor="middle" fill="#F8E6CE" font-size="17">session + buffers</text><text x="1228" y="390" text-anchor="middle" fill="#F8E6CE" font-size="17">protocol state</text><g fill="#D8E3EF" font-size="19"><text x="830" y="485">Design must answer:</text><text x="855" y="525">• can another node resume the session?</text><text x="855" y="562">• where is state replicated?</text><text x="855" y="599">• what happens when the owner fails?</text></g><rect x="250" y="705" width="1000" height="48" rx="11" fill="#153929"/><text x="750" y="736" text-anchor="middle" fill="#B5F5D4" font-size="20" font-weight="700">Horizontal scaling is easiest when per-request computation is replaceable and state has an explicit home.</text></g></svg>
