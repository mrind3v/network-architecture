<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800" role="img" aria-labelledby="title desc"><title id="title">A production server combines worker processes with event loops</title><desc id="desc">A master starts several workers. The kernel distributes accepted connections to workers, each of which owns an event loop over many sockets. Blocking or CPU-heavy tasks go to bounded helper pools.</desc><defs><marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L12 6L0 12z" fill="#62E5DB"/></marker></defs><rect width="1500" height="800" fill="#0B1220"/><g font-family="Arial, sans-serif"><text x="70" y="70" fill="#F1F5F9" font-size="40" font-weight="700">Isolation outside, multiplexing inside</text><text x="70" y="108" fill="#A8B7CB" font-size="21">The exact accept strategy varies, but a small worker pool plus readiness loops is a common shape.</text>
<rect x="595" y="150" width="310" height="90" rx="18" fill="#172B45" stroke="#4AA8FF" stroke-width="3"/><text x="750" y="190" text-anchor="middle" fill="#83C6FF" font-size="25" font-weight="700">Master process</text><text x="750" y="220" text-anchor="middle" fill="#D8E3EF" font-size="18">configuration + worker lifecycle</text>
<rect x="80" y="320" width="350" height="255" rx="20" fill="#111C2E" stroke="#35D3C9" stroke-width="3"/><rect x="575" y="320" width="350" height="255" rx="20" fill="#111C2E" stroke="#35D3C9" stroke-width="3"/><rect x="1070" y="320" width="350" height="255" rx="20" fill="#111C2E" stroke="#35D3C9" stroke-width="3"/>
<g text-anchor="middle"><text x="255" y="370" fill="#62E5DB" font-size="24" font-weight="700">Worker 1</text><text x="750" y="370" fill="#62E5DB" font-size="24" font-weight="700">Worker 2</text><text x="1245" y="370" fill="#62E5DB" font-size="24" font-weight="700">Worker N</text><g fill="#D8E3EF" font-size="19"><text x="255" y="417">one event loop</text><text x="255" y="452">many connected FDs</text><text x="255" y="487">bounded callbacks</text><text x="750" y="417">one event loop</text><text x="750" y="452">many connected FDs</text><text x="750" y="487">bounded callbacks</text><text x="1245" y="417">one event loop</text><text x="1245" y="452">many connected FDs</text><text x="1245" y="487">bounded callbacks</text></g></g>
<g stroke="#62E5DB" stroke-width="4" fill="none" marker-end="url(#a)"><line x1="680" y1="242" x2="320" y2="316"/><line x1="750" y1="242" x2="750" y2="316"/><line x1="820" y1="242" x2="1180" y2="316"/></g>
<rect x="330" y="650" width="840" height="75" rx="16" fill="#3A2E1E" stroke="#F9B357" stroke-width="2"/><text x="750" y="682" text-anchor="middle" fill="#F9B357" font-size="21" font-weight="700">Blocking disk, DNS, or CPU-heavy work</text><text x="750" y="709" text-anchor="middle" fill="#F8E6CE" font-size="18">offload to a bounded thread/process pool so the readiness loop keeps moving</text></g></svg>
