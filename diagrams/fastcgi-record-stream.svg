<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860" role="img" aria-labelledby="title desc"><title id="title">A FastCGI request and response as typed records</title><desc id="desc">A FastCGI responder request starts with BEGIN_REQUEST, sends PARAMS records followed by an empty PARAMS record, sends STDIN body records followed by empty STDIN, then receives STDOUT, optional STDERR, and END_REQUEST. Every record has a content length and request ID.</desc><defs><marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L12 6L0 12z" fill="#62E5DB"/></marker></defs><rect width="1500" height="860" fill="#0B1220"/><g font-family="Arial, sans-serif"><text x="70" y="70" fill="#F1F5F9" font-size="40" font-weight="700">FastCGI frames several logical streams with typed records</text><text x="70" y="108" fill="#A8B7CB" font-size="21">A zero-content record ends a stream; it is not a zero byte inside the application's data.</text><text x="255" y="165" text-anchor="middle" fill="#83C6FF" font-size="24" font-weight="700">Web server</text><text x="1245" y="165" text-anchor="middle" fill="#C4B5FD" font-size="24" font-weight="700">FastCGI application</text><line x1="255" y1="190" x2="255" y2="770" stroke="#334155" stroke-width="3"/><line x1="1245" y1="190" x2="1245" y2="770" stroke="#334155" stroke-width="3"/>
<g font-size="18"><g stroke="#62E5DB" stroke-width="4" marker-end="url(#a)"><line x1="270" y1="230" x2="1230" y2="230"/><line x1="270" y1="300" x2="1230" y2="300"/><line x1="270" y1="370" x2="1230" y2="370"/><line x1="270" y1="440" x2="1230" y2="440"/></g><g text-anchor="middle"><text x="750" y="218" fill="#62E5DB" font-weight="700">FCGI_BEGIN_REQUEST · requestId 7</text><text x="750" y="288" fill="#62E5DB" font-weight="700">FCGI_PARAMS · method, script, headers...</text><text x="750" y="358" fill="#F9B357" font-weight="700">FCGI_PARAMS · contentLength 0 → parameter stream finished</text><text x="750" y="428" fill="#62E5DB" font-weight="700">FCGI_STDIN · request body bytes</text></g><g stroke="#62E5DB" stroke-width="4" marker-end="url(#a)"><line x1="270" y1="510" x2="1230" y2="510"/></g><text x="750" y="498" text-anchor="middle" fill="#F9B357" font-weight="700">FCGI_STDIN · contentLength 0 → request body stream finished</text><g stroke="#A78BFA" stroke-width="4" marker-end="url(#a)"><line x1="1230" y1="590" x2="270" y2="590"/><line x1="1230" y1="660" x2="270" y2="660"/><line x1="1230" y1="730" x2="270" y2="730"/></g><g text-anchor="middle"><text x="750" y="578" fill="#C4B5FD" font-weight="700">FCGI_STDOUT · response headers + body</text><text x="750" y="648" fill="#C4B5FD" font-weight="700">FCGI_STDOUT · contentLength 0 → stdout stream finished</text><text x="750" y="718" fill="#C4B5FD" font-weight="700">FCGI_END_REQUEST · application status</text></g></g><rect x="450" y="785" width="600" height="48" rx="10" fill="#153929"/><text x="750" y="816" text-anchor="middle" fill="#B5F5D4" font-size="19" font-weight="700">Record header = version + type + request ID + content length + padding length</text></g></svg>
