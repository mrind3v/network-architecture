<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">A SYN flood targets half-open connection state and SYN cookies reduce that state</title>
  <desc id="desc">Normally a server stores handshake state after receiving SYN. Under attack spoofed SYNs fill the half-open backlog. With SYN cookies, the server encodes limited state into its initial sequence number and validates the returned ACK before allocating connection state.</desc>
  <defs><marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0L12 6L0 12z" fill="#62E5DB"/></marker></defs>
  <rect width="1500" height="760" fill="#0B1220"/>
  <g font-family="Arial, sans-serif">
    <text x="70" y="68" fill="#F1F5F9" font-size="40" font-weight="700">SYN cookies delay state allocation until a valid ACK returns</text>
    <text x="70" y="106" fill="#A8B7CB" font-size="21">They are a pressure-relief defence, not authentication and not a replacement for normal capacity planning.</text>
    <text x="90" y="165" fill="#FB7185" font-size="27" font-weight="700">Without cookies: state is stored after every SYN</text>
    <rect x="90" y="195" width="270" height="80" rx="14" fill="#3A2430" stroke="#FB7185" stroke-width="3"/><text x="225" y="244" text-anchor="middle" fill="#FDA4AF" font-size="22">spoofed clients</text>
    <rect x="570" y="195" width="360" height="80" rx="14" fill="#172B45" stroke="#4AA8FF" stroke-width="3"/><text x="750" y="244" text-anchor="middle" fill="#83C6FF" font-size="22">server receives many SYNs</text>
    <rect x="1140" y="195" width="270" height="80" rx="14" fill="#3A2430" stroke="#FB7185" stroke-width="3"/><text x="1275" y="230" text-anchor="middle" fill="#FDA4AF" font-size="21">half-open backlog</text><text x="1275" y="257" text-anchor="middle" fill="#D8E3EF" font-size="18">eventually fills</text>
    <line x1="362" y1="235" x2="568" y2="235" stroke="#FB7185" stroke-width="4" marker-end="url(#a)"/><line x1="932" y1="235" x2="1138" y2="235" stroke="#FB7185" stroke-width="4" marker-end="url(#a)"/>

    <text x="90" y="365" fill="#62E5DB" font-size="27" font-weight="700">With cookies under pressure: state travels out and must come back</text>
    <rect x="90" y="395" width="270" height="80" rx="14" fill="#17314A" stroke="#35D3C9" stroke-width="3"/><text x="225" y="444" text-anchor="middle" fill="#62E5DB" font-size="22">real client sends SYN</text>
    <rect x="615" y="395" width="270" height="80" rx="14" fill="#172B45" stroke="#4AA8FF" stroke-width="3"/><text x="750" y="430" text-anchor="middle" fill="#83C6FF" font-size="21">server computes cookie</text><text x="750" y="457" text-anchor="middle" fill="#D8E3EF" font-size="18">inside SYN-ACK sequence number</text>
    <rect x="1140" y="395" width="270" height="80" rx="14" fill="#153929" stroke="#35D3C9" stroke-width="3"/><text x="1275" y="430" text-anchor="middle" fill="#B5F5D4" font-size="21">valid ACK returns</text><text x="1275" y="457" text-anchor="middle" fill="#D8E3EF" font-size="18">now allocate connection state</text>
    <line x1="362" y1="435" x2="613" y2="435" stroke="#62E5DB" stroke-width="4" marker-end="url(#a)"/><line x1="887" y1="435" x2="1138" y2="435" stroke="#62E5DB" stroke-width="4" marker-end="url(#a)"/>
    <rect x="250" y="555" width="1000" height="130" rx="18" fill="#111C2E" stroke="#F9B357" stroke-width="3"/>
    <text x="750" y="600" text-anchor="middle" fill="#F9B357" font-size="26" font-weight="700">What is encoded?</text>
    <text x="750" y="640" text-anchor="middle" fill="#D8E3EF" font-size="21">A keyed value derived from the connection identity, a coarse time value, and limited option data.</text>
    <text x="750" y="671" text-anchor="middle" fill="#A8B7CB" font-size="19">Because only 32 sequence-number bits are available, some TCP options may be constrained.</text>
  </g>
</svg>
