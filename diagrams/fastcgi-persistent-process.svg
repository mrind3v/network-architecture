<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc"><title id="title">FastCGI removes process startup from each request</title><desc id="desc">Many clients connect to a public web server, which handles HTTP and TLS. It sends typed FastCGI records over a persistent local socket to a fixed pool of long-lived application workers.</desc><defs><marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L12 6L0 12z" fill="#62E5DB"/></marker></defs><rect width="1500" height="760" fill="#0B1220"/><g font-family="Arial, sans-serif"><text x="70" y="70" fill="#F1F5F9" font-size="40" font-weight="700">FastCGI pays process setup once, then reuses the workers</text><text x="70" y="108" fill="#A8B7CB" font-size="21">The public server protects the application pool from slow clients and translates HTTP into FastCGI records.</text>
<g text-anchor="middle"><rect x="65" y="220" width="290" height="180" rx="20" fill="#172B45" stroke="#4AA8FF" stroke-width="3"/><text x="210" y="265" fill="#83C6FF" font-size="25" font-weight="700">Clients</text><text x="210" y="305" fill="#D8E3EF" font-size="19">many TCP connections</text><text x="210" y="338" fill="#D8E3EF" font-size="19">some fast, some slow</text><text x="210" y="371" fill="#D8E3EF" font-size="19">HTTP / HTTPS</text><rect x="555" y="190" width="360" height="240" rx="20" fill="#143743" stroke="#35D3C9" stroke-width="3"/><text x="735" y="240" fill="#62E5DB" font-size="25" font-weight="700">nginx / httpd</text><text x="735" y="282" fill="#D8E3EF" font-size="19">TLS + HTTP parsing</text><text x="735" y="316" fill="#D8E3EF" font-size="19">timeouts + buffering</text><text x="735" y="350" fill="#D8E3EF" font-size="19">static files + routing</text><text x="735" y="384" fill="#D8E3EF" font-size="19">upstream connection management</text><rect x="1115" y="175" width="310" height="270" rx="20" fill="#281F45" stroke="#A78BFA" stroke-width="3"/><text x="1270" y="225" fill="#C4B5FD" font-size="25" font-weight="700">Application pool</text><g fill="#352857"><rect x="1160" y="260" width="220" height="45" rx="9"/><rect x="1160" y="320" width="220" height="45" rx="9"/><rect x="1160" y="380" width="220" height="45" rx="9"/></g><g fill="#E9D5FF" font-size="18"><text x="1270" y="289">worker 1</text><text x="1270" y="349">worker 2</text><text x="1270" y="409">worker N</text></g></g>
<g stroke="#62E5DB" stroke-width="5" fill="none" marker-end="url(#a)"><line x1="357" y1="310" x2="551" y2="310"/><line x1="917" y1="310" x2="1111" y2="310"/></g><text x="455" y="287" text-anchor="middle" fill="#F9B357" font-size="18" font-weight="700">HTTP</text><text x="1015" y="287" text-anchor="middle" fill="#F9B357" font-size="18" font-weight="700">FastCGI over socket</text><rect x="245" y="535" width="1010" height="105" rx="18" fill="#153929"/><text x="750" y="575" text-anchor="middle" fill="#B5F5D4" font-size="22" font-weight="700">Amortize setup</text><text x="750" y="610" text-anchor="middle" fill="#D8E3EF" font-size="19">start workers at service startup, reuse them across requests, and bound the pool to protect memory</text><text x="750" y="700" text-anchor="middle" fill="#A8B7CB" font-size="18">FastCGI defines the interface; a particular implementation may or may not multiplex concurrent requests on one connection.</text></g></svg>
