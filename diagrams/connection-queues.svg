<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">TCP connection attempts move through handshake state into the accept queue</title>
  <desc id="desc">The kernel receives client connection attempts, tracks handshakes that are not finished, places established connections in the accept queue, and accept returns one connected file descriptor to the server process while listening continues.</desc>
  <defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#62E5DB"/></marker></defs>
  <rect width="1500" height="760" fill="#0B1220"/>
  <g font-family="Arial, sans-serif">
    <text x="76" y="78" fill="#F1F5F9" font-size="40" font-weight="700">Listening is a pipeline, not one waiting client</text>
    <text x="76" y="118" fill="#A8B7CB" font-size="22">The kernel can progress several connection attempts while the process is busy or sleeping.</text>

    <rect x="76" y="190" width="250" height="390" rx="20" fill="#172B45" stroke="#4AA8FF" stroke-width="3"/>
    <text x="112" y="238" fill="#83C6FF" font-size="25" font-weight="700">Clients</text>
    <rect x="112" y="280" width="176" height="62" rx="12" fill="#111C2E"/><text x="150" y="319" fill="#D8E3EF" font-size="21">Client A</text>
    <rect x="112" y="366" width="176" height="62" rx="12" fill="#111C2E"/><text x="150" y="405" fill="#D8E3EF" font-size="21">Client B</text>
    <rect x="112" y="452" width="176" height="62" rx="12" fill="#111C2E"/><text x="150" y="491" fill="#D8E3EF" font-size="21">Client C</text>

    <line x1="326" y1="385" x2="416" y2="385" stroke="#62E5DB" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="428" y="190" width="740" height="390" rx="20" fill="#111C2E" stroke="#2A455F" stroke-width="3"/>
    <text x="464" y="238" fill="#F9B357" font-size="25" font-weight="700">Server kernel — attached to server_fd</text>

    <rect x="464" y="282" width="288" height="204" rx="16" fill="#3A2E1E" stroke="#F9B357" stroke-width="3"/>
    <text x="496" y="326" fill="#F9B357" font-size="23" font-weight="700">Handshake in progress</text>
    <text x="496" y="365" fill="#F8E6CE" font-size="20">SYN received</text>
    <text x="496" y="398" fill="#F8E6CE" font-size="20">waiting for final ACK</text>
    <text x="496" y="445" fill="#A8B7CB" font-size="19">Not yet “completed”</text>

    <line x1="752" y1="384" x2="828" y2="384" stroke="#62E5DB" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="840" y="282" width="290" height="204" rx="16" fill="#143743" stroke="#35D3C9" stroke-width="3"/>
    <text x="872" y="326" fill="#62E5DB" font-size="23" font-weight="700">Accept queue</text>
    <rect x="872" y="354" width="226" height="42" rx="9" fill="#17314A"/><text x="894" y="382" fill="#D8E3EF" font-size="19">Established A</text>
    <rect x="872" y="410" width="226" height="42" rx="9" fill="#17314A"/><text x="894" y="438" fill="#D8E3EF" font-size="19">Established B</text>
    <text x="872" y="474" fill="#A8B7CB" font-size="19">Handshake complete</text>

    <line x1="1168" y1="385" x2="1248" y2="385" stroke="#62E5DB" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="1260" y="250" width="180" height="270" rx="20" fill="#172B45" stroke="#4AA8FF" stroke-width="3"/>
    <text x="1293" y="298" fill="#83C6FF" font-size="24" font-weight="700">Process</text>
    <text x="1293" y="345" fill="#D8E3EF" font-size="20">accept()</text>
    <text x="1293" y="376" fill="#D8E3EF" font-size="20">removes A</text>
    <rect x="1292" y="412" width="116" height="62" rx="12" fill="#143743"/>
    <text x="1315" y="451" fill="#62E5DB" font-size="21" font-weight="700">FD 4</text>

    <rect x="76" y="638" width="1364" height="66" rx="14" fill="#143743"/>
    <text x="112" y="679" fill="#62E5DB" font-size="22">accept() removes one established connection; server_fd stays open and the kernel keeps receiving, handshaking, and queueing others.</text>
  </g>
</svg>
